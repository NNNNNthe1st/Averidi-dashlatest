# Development only. Ports bind to loopback; no existing product resources.
services:
  dashboard-identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: https://localhost:9443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./realm.json:/opt/keycloak/data/import/dashboard-realm.json:ro
      - dashboard_identity_data:/opt/keycloak/data
  dashboard-development-tls:
    image: caddy:2.11.7-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dashboard_development_tls:/data
    depends_on:
      - dashboard-identity
volumes:
  dashboard_identity_data:
  dashboard_development_tls:
